# Publie le site sur GitHub Pages à chaque modification de la branche principale.
# Adresse : https://<compte>.github.io/<dépôt>/  (aperçu non référencé par les moteurs de recherche)
name: Publier le site

on:
  push:
    branches: [main, claude/new-session-2l3a6f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Générer le site
        env:
          SITE_DOMAIN: ${{ steps.pages.outputs.base_url }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_NOINDEX: "1"
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
